[package]
name = "trekr"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
serde_json = "1"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
libc = "0.2"
lsp-server = "0.7"
lsp-types = "0.97"
num_cpus = "1"
rayon = "1"
ruby-prism = "1.9.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
