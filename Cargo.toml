[package]
name = "trekr"
version = "0.8.9"
edition = "2024"
description = "Ruby code intelligence: position→meaning, definition→references."
license = "MIT"
repository = "https://github.com/dpep/trekr"
keywords = ["ruby", "code-intelligence", "lsp", "prism", "rails"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
hashbrown = { version = "0.17", default-features = false }
libc = "0.2"
lsp-server = "0.7"
lsp-types = "0.97"
memmap2 = "0.9"
num_cpus = "1"
rayon = "1"
ruby-prism = "1.9.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"

# Discipline the code already keeps, held by the gate.
[lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
