[package]
name = "trekr"
version = "0.1.2"
edition = "2024"
description = "Ruby code intelligence: position→meaning, definition→references."
license = "MIT"
repository = "https://github.com/dpep/trekr"
keywords = ["ruby", "code-intelligence", "lsp", "prism", "rails"]
categories = ["development-tools", "command-line-utilities"]

[dev-dependencies]
serde_json = "1"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
libc = "0.2"
lsp-server = "0.7"
lsp-types = "0.97"
num_cpus = "1"
rayon = "1"
ruby-prism = "1.9.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
